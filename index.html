function fieldHTML(q,i){
 const a=answers[q.id],opts=q.options||[];
 let inner='';
 if(q.type==='text')inner=`<textarea class="text-input" rows="3" maxlength="2000" data-answer="${q.id}" placeholder="${esc(t('detailPlaceholder'))}" aria-label="${esc(tr(q.label))}">${esc(a)}</textarea>`;
 else inner=`<div class="${q.type==='rating'?'rating':'options'+(q.type==='single'?' single':'')}">${opts.map((o,j)=>`<label class="choice"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" value="${esc(o.id)}" data-answer="${q.id}" ${(Array.isArray(a)?a.includes(o.id):a===o.id)?'checked':''} ${busy?'disabled':''}><${q.type==='rating'?'b':'span'}${q.type==='rating'?' aria-hidden="true"':''}>${q.type==='rating'?j+1:esc(tr(o.label))}</${q.type==='rating'?'b':'span'}>${q.type==='rating'?`<span>${esc(tr(o.label))}</span>`:''}</label>`).join('')}</div>`;
 if(q.type==='multi'&&a.includes('other'))inner+=`<input class="text-input other" data-other="${q.id}" value="${esc(other[q.id])}" maxlength="300" placeholder="${esc(t('otherPlaceholder'))}" aria-label="${esc(tr(q.label))}: ${esc(t('otherPlaceholder'))}">`;
 return `<fieldset class="question${errors.includes(q.id)?' invalid':''}" id="q-${q.id}"><legend><span class="q-head"><span class="q-num">${String(i+1).padStart(2,'0')}</span><span>${esc(tr(q.label))}${q.required?' <span aria-hidden="true" style="color:var(--green)">•</span>':''}</span></span></legend><p class="q-meta">${esc(q.type==='multi'?t('chooseMany'):q.required?t('required'):t('optional'))}</p>${inner}</fieldset>`;
}
function render(){
 if(route!=='survey'){renderTool();return}
 applyColors();document.documentElement.lang=lang;document.title=config.brand+' | '+tr(config.text.steps[step]);
 const host=isEditor?$('#preview'):$('#app');
 host.innerHTML=`<header><div class="brand">${config.logo?`<img src="${esc(config.logo)}" alt="${esc(config.brand)}">`:esc(config.brand)+'<span class="brand-dot"></span>'}</div><div class="header-right">${!isEditor&&BOOT.mode==='preview'?'<a class="edit-link" href="editor.html">Chỉnh nội dung ↗</a>':''}<div class="lang" aria-label="Language"><button data-lang="en" class="${lang==='en'?'active':''}" aria-pressed="${lang==='en'}">English</button><button data-lang="vi" class="${lang==='vi'?'active':''}" aria-pressed="${lang==='vi'}">Tiếng Việt</button></div></div></header>
 <main class="shell"><aside class="intro"><p class="eyebrow">${esc(t('eyebrow'))}</p><h1>${esc(t('title'))}</h1><p class="intro-text">${esc(t('intro'))}</p><div class="duration"><span aria-hidden="true">◷</span><span>${esc(t('duration'))}</span></div>${art}<p class="privacy">${esc(t('privacy'))}</p></aside><section class="form-card" aria-label="${esc(t('title'))}">
 ${BOOT.mode!=='live'?`<div class="preview-note">${esc(t('preview'))}</div>`:''}
 ${receipt?`<div class="success" role="status"><div class="checkmark">✓</div><h2>${esc(t('successTitle'))}</h2><p>${esc(t('successBody'))}</p><p>${esc(t('receipt'))}<br><code>${esc(receipt)}</code></p></div>`:`<div class="progress-head"><div class="steps">${config.text.steps.map((x,i)=>`<div class="step ${i===step?'current':i<step?'done':''}" ${i===step?'aria-current="step"':''}><b>${i<step?'✓':i+1}</b><span>${esc(tr(x))}</span></div>`).join('')}</div><div class="track"><i style="width:${(step+1)*100/3}%"></i></div></div><form class="form-body" novalidate>${config.questions.map((q,i)=>q.step===step?fieldHTML(q,i):'').join('')}
 ${step===2?`<section class="contact"><h3>${esc(t('contactTitle'))} <span class="q-meta">${esc(t('optional'))}</span></h3><p>${esc(t('contactHint'))}</p><div class="contact-grid">${['name','company','email'].map(k=>`<label>${esc(t(k))}<input class="text-input" type="${k==='email'?'email':'text'}" data-contact="${k}" value="${esc(contact[k])}" autocomplete="${k==='company'?'organization':k}" maxlength="${k==='email'?254:150}" ${busy?'disabled':''}></label>`).join('')}</div><p id="email-hint"></p><p>${esc(t('privacy'))}</p></section>`:''}
 <div class="honeypot" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><div class="status" role="alert" aria-live="polite"></div><div class="nav">${step>0?`<button class="btn secondary" type="button" id="back" ${busy?'disabled':''}>← ${esc(t('back'))}</button>`:'<span class="counter">01 / 03</span>'}<button class="btn" id="next" type="submit" ${busy?'disabled':''}>${esc(busy?t('sending'):step===2?t('submit'):t('next'))}<span aria-hidden="true">${step===2?'↗':'→'}</span></button></div></form>`}</section></main><footer><span>${esc(t('footer'))}</span><span><i class="notice-dot"></i>${esc(config.brand)}</span></footer>`;
 host.querySelector('header').insertAdjacentHTML('afterend',toolsNav());
 bindTools(host);
 host.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
 host.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener(el.tagName==='TEXTAREA'?'input':'change',()=>{
 const id=el.dataset.answer,q=config.questions.find(x=>x.id===id);
 if(q.type==='multi'){
 let a=answers[id];
 if(el.checked)a=el.value==='none'?['none']:[...a.filter(x=>x!=='none'&&x!==el.value),el.value];else a=a.filter(x=>x!==el.value);
 answers[id]=a;
 if(!a.includes('other'))other[id]='';
 const focusValue=el.value;render();host.querySelector(`[name="${id}"][value="${focusValue}"]`)?.focus({preventScroll:true});
 }else{answers[id]=el.value;if(q.id==='followup')updateEmailHint();}
 }));
 host.querySelectorAll('[data-other]').forEach(el=>el.oninput=()=>other[el.dataset.other]=el.value);
 host.querySelectorAll('[data-contact]').forEach(el=>el.oninput=()=>{contact[el.dataset.contact]=el.value;updateEmailHint()});
 const form=host.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();next()};
 if(host.querySelector('#back'))host.querySelector('#back').onclick=()=>{if(busy)return;step--;errors=[];render();scrollForm()};
 updateEmailHint();
}
function toolsNav(){return `<nav class="tools-nav" aria-label="THT tools">${[['home','home'],['ask','askTitle'],['survey','surveyTitle']].map(([r,k])=>`<button type="button" data-route="${r}" class="${route===r?'active':''}" ${busy?'disabled':''} ${route===r?'aria-current="page"':''}>${esc(tt(k))}</button>`).join('')}</nav>`}
function bindTools(host){host.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{if(busy)return;route=b.dataset.route;render()});host.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()})}
function renderTool(){
 applyColors();document.documentElement.lang=lang;document.title=config.brand+' | '+tt(route==='home'?'homeTitle':'askTitle');
 const host=isEditor?$('#preview'):$('#app');
 const header=`<header><div class="brand">${config.logo?`<img src="${esc(config.logo)}" alt="${esc(config.brand)}">`:esc(config.brand)+'<span class="brand-dot"></span>'}</div><div class="header-right">${!isEditor&&BOOT.mode==='preview'?'<a class="edit-link" href="editor.html">Chỉnh nội dung ↗</a>':''}<div class="lang" aria-label="Language">${['en','vi'].map(l=>`<button data-lang="${l}" class="${lang===l?'active':''}" aria-pressed="${lang===l}">${l==='en'?'English':'Tiếng Việt'}</button>`).join('')}</div></div></header>`;
 const notice=BOOT.mode!=='live'?`<div class="preview-note">${esc(t('preview'))}</div>`:'';
 const content=route==='home'?`<section class="tool-home"><p class="eyebrow">${esc(config.brand)}</p><h1>${esc(tt('homeTitle'))}</h1><p class="home-intro">${esc(tt('homeIntro'))}</p><div class="tool-cards"><button class="tool-choice" data-route="ask"><span class="tool-icon">?</span><strong>${esc(tt('askTitle'))}</strong><span>${esc(tt('askIntro'))}</span><b aria-hidden="true">↗</b></button><button class="tool-choice" data-route="survey"><span class="tool-icon green">✓</span><strong>${esc(tt('surveyTitle'))}</strong><span>${esc(tt('surveyIntro'))}</span><b aria-hidden="true">↗</b></button></div>${art}</section>`:
 `<main class="shell ask-shell"><aside class="intro"><p class="eyebrow">${esc(config.brand)}</p><h1>${esc(tt('askTitle'))}</h1><p class="intro-text">${esc(tt('askIntro'))}</p>${art}<p class="privacy">${esc(tt('askPrivacy'))}</p></aside><section class="form-card">${notice}${questionReceipt?`<div class="success" role="status"><div class="checkmark">✓</div><h2>${esc(tt('askSuccessTitle'))}</h2><p>${esc(tt('askSuccessBody'))}</p><p>${esc(tt('askReceipt'))}<br><code>${esc(questionReceipt)}</code></p><button class="btn" id="ask-another">${esc(tt('askAnother'))}</button></div>`:
 `<form id="ask-form" class="ask-form" novalidate><label class="ask-label" for="question-text">${esc(tt('questionLabel'))} <span style="color:var(--green)">•</span></label><textarea id="question-text" class="text-input" rows="7" maxlength="2000" placeholder="${esc(tt('questionPlaceholder'))}" ${busy?'disabled':''}>${esc(questionText)}</textarea><p class="ask-count"><span>${esc(tt('askHint'))}</span><span id="question-count">${questionText.length} / 2000</span></p><label class="ask-label" for="question-name">${esc(tt('askName'))} <small>${esc(t('optional'))}</small></label><input id="question-name" class="text-input" maxlength="150" autocomplete="name" value="${esc(questionName)}" placeholder="${esc(tt('askNamePlaceholder'))}" ${busy?'disabled':''}><p class="editor-note">${esc(tt('askPrivacy'))}</p><div class="honeypot" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><div class="status" role="alert"></div><div class="nav"><span></span><button class="btn" type="submit" ${busy?'disabled':''}>${esc(busy?t('sending'):tt('askSubmit'))} ↗</button></div></form>`}</section></main>`;
 host.innerHTML=header+toolsNav()+(route==='home'?notice:'')+content+`<footer><span>${esc(t('footer'))}</span><span>${esc(config.brand)}</span></footer>`;
 bindTools(host);
 if($('#question-text'))$('#question-text').oninput=e=>{questionText=e.target.value;$('#question-count').textContent=questionText.length+' / 2000'};
 if($('#question-name'))$('#question-name').oninput=e=>questionName=e.target.value;
 if($('#ask-form'))$('#ask-form').onsubmit=e=>{e.preventDefault();sendQuestion()};
 if($('#ask-another'))$('#ask-another').onclick=()=>{questionText='';questionReceipt=null;questionId=newId();render()};
}
async function sendQuestion(){
 if(busy)return;
 if(!questionText.trim()){$('.status').textContent=tt('askRequired');$('#question-text').focus();return}
 if(BOOT.mode!=='live'||!config.backendUrl){$('.status').textContent=BOOT.mode==='live'?t('connectionMissing'):t('previewSubmit');return}
 const payload={action:'question',id:questionId,version:config.version,lang,name:questionName.trim(),question:questionText.trim(),website:$('[name="website"]').value,elapsed:Date.now()-startedAt};
 busy=true;render();const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),30000);
 try{const res=await fetch(config.backendUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:ac.signal});if(!res.ok)throw Error('HTTP');const out=await res.json();if(!out.ok||out.id!==questionId)throw Error(out.error||'ACK');questionReceipt=out.id;busy=false;render()}
 catch(err){busy=false;render();$('.status').textContent=err.message==='STALE_CONFIG'?t('stale'):t('failed')}
 finally{clearTimeout(timer)}
}
function updateEmailHint(){const el=$('#email-hint');if(el)el.textContent=['week','month'].includes(answers.followup)&&!contact.email.trim()?t('noEmail'):''}
function scrollForm(){if(!isEditor)$('.form-card')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
function validateStep(){errors=[];for(const q of config.questions.filter(q=>q.step===step)){const a=answers[q.id];if(q.required&&(!a||(Array.isArray(a)&&!a.length)))errors.push(q.id);if(q.type==='multi'&&a.includes('other')&&!other[q.id].trim())errors.push(q.id)}return !errors.length}
async function next(){
 if(busy)return;
 if(!validateStep()){render();$('.status').textContent=t('requiredError');$('.invalid input,.invalid textarea')?.focus();return}
 if(step<2){step++;render();scrollForm();return}
 if(contact.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email.trim())){$('.status').textContent=t('invalidEmail');$('[data-contact="email"]').focus();return}
 if(BOOT.mode!=='live'||!config.backendUrl){$('.status').textContent=BOOT.mode==='live'?t('connectionMissing'):t('previewSubmit');return}
 const payload={id:responseId,version:config.version,lang,answers,other,contact,website:$('[name="website"]').value,elapsed:Date.now()-startedAt};
 busy=true;render();
 const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),30000);
 try{
 const res=await fetch(config.backendUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:ac.signal});
 if(!res.ok)throw Error('HTTP');
 const out=await res.json();if(!out.ok||out.id!==responseId)throw Error(out.error||'ACK');
 receipt=out.id;busy=false;render();scrollForm();
 }catch(err){busy=false;render();$('.status').textContent=err.message==='STALE_CONFIG'?t('stale'):t('failed')}
 finally{clearTimeout(timer)}
}
function download(name,text,mime='application/json'){const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function setPath(obj,path,val){let p=path.split('.'),o=obj;for(const k of p.slice(0,-1))o=o[k];o[p.at(-1)]=val}
function editPair(v,path,label){return `<label>${esc(label)}</label><div class="pair">${['vi','en'].map(l=>`<div><label>${l==='vi'?'Tiếng Việt':'English'}</label><textarea data-edit="${path}.${l}">${esc(v[l])}</textarea></div>`).join('')}</div>`}
const textLabels={eyebrow:'Dòng mở đầu',title:'Tiêu đề',intro:'Lời giới thiệu',duration:'Thời lượng',privacy:'Thông tin sử dụng phản hồi',back:'Nút quay lại',next:'Nút tiếp tục',submit:'Nút gửi',sending:'Trạng thái đang gửi',optional:'Nhãn không bắt buộc',required:'Nhãn bắt buộc',chooseMany:'Hướng dẫn chọn nhiều',otherPlaceholder:'Gợi ý nội dung khác',detailPlaceholder:'Gợi ý nhu cầu cụ thể',contactTitle:'Tiêu đề liên hệ',contactHint:'Hướng dẫn liên hệ',name:'Họ tên',company:'Công ty',email:'Email',noEmail:'Nhắc khi chưa có email',invalidEmail:'Email chưa hợp lệ',requiredError:'Nhắc câu bắt buộc',otherError:'Nhắc nội dung khác',preview:'Thông báo bản xem trước',previewSubmit:'Gửi ở bản xem trước',failed:'Thông báo lỗi gửi',stale:'Thông báo cập nhật',successTitle:'Tiêu đề cảm ơn',successBody:'Nội dung cảm ơn',receipt:'Mã phản hồi',footer:'Chân trang'};
function validateConfig(c){
 if(!c||typeof c!=='object'||typeof c.brand!=='string'||c.brand.length>100)throw Error('Tên thương hiệu không hợp lệ.');
 if(!/^#[0-9a-f]{6}$/i.test(c.primary)||!/^#[0-9a-f]{6}$/i.test(c.accent))throw Error('Màu chưa hợp lệ.');
 if(!['en','vi'].includes(c.defaultLanguage))throw Error('Ngôn ngữ chưa hợp lệ.');
 if(typeof c.logo!=='string'||c.logo.length>300000||(c.logo&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(c.logo)))throw Error('Logo cần là ảnh PNG, JPG hoặc WebP.');
 const pair=x=>x&&['vi','en'].every(l=>typeof x[l]==='string'&&x[l].trim()&&x[l].length<=3000);
 if(!c.text||Object.keys(textLabels).some(k=>!pair(c.text[k]))||!Array.isArray(c.text.steps)||c.text.steps.length!==3||c.text.steps.some(x=>!pair(x)))throw Error('Nội dung song ngữ chưa đầy đủ.');
 if(!c.tools||Object.keys(BOOT.config.tools).some(k=>!pair(c.tools[k])))throw Error('Nội dung công cụ chưa đầy đủ.');
 if(!Array.isArray(c.questions)||c.questions.length!==BOOT.config.questions.length)throw Error('Cấu trúc câu hỏi chưa hợp lệ.');
 c.questions.forEach((q,i)=>{const base=BOOT.config.questions[i];if(q.id!==base.id||q.type!==base.type||q.step!==base.step||q.required!==base.required||!pair(q.label))throw Error('Cấu trúc câu hỏi đã thay đổi.');if(base.options&&(!q.options||q.options.length!==base.options.length||q.options.some((o,j)=>o.id!==base.options[j].id||!pair(o.label))))throw Error('Lựa chọn chưa hợp lệ.');});
 if(JSON.stringify(c).length>500000)throw Error('Tệp quá lớn.');return true;
}
function editor(){
 document.body.innerHTML=`<div class="editor-bar"><div><strong>THT · Chỉnh sửa form</strong><p>Đổi nội dung, xem trước, xuất JSON.</p></div><div class="editor-actions"><button class="btn secondary" id="import-btn">Nhập JSON</button><button class="btn" id="export-btn">Xuất JSON ↓</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></div><div class="editor-layout"><aside class="editor-panel" id="panel"></aside><div class="editor-preview" id="preview"></div></div>`;
 $('#import-btn').onclick=()=>$('#import-file').click();
 $('#import-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>600000)throw Error('Tệp quá lớn.');const c=migrateConfig(JSON.parse(await f.text()));validateConfig(c);config=c;lang=config.defaultLanguage;saveDraft();drawPanel();render();editorStatus('Đã nhập nội dung.')}catch(err){editorStatus(err.message)}};
 $('#export-btn').onclick=()=>{try{validateConfig(config);config.version=String(Date.now());saveDraft();download('THT_Feedback_Config.json',JSON.stringify(config,null,2));editorStatus('Đã xuất JSON. Gửi tệp này để đóng gói bản final cho GitHub.')}catch(err){editorStatus(err.message)}};
 drawPanel();render();
}
function editorStatus(s){$('#editor-status').textContent=s}
function migrateConfig(c){if(c&&typeof c==='object')c.tools={...structuredClone(BOOT.config.tools),...(c.tools||{})};return c}
const toolLabels={homeTitle:'Tiêu đề trang chính',homeIntro:'Giới thiệu trang chính',askTitle:'Tên mục gửi câu hỏi',askIntro:'Giới thiệu gửi câu hỏi',surveyTitle:'Tên mục khảo sát',surveyIntro:'Giới thiệu khảo sát',home:'Nút trang chính',questionLabel:'Nhãn câu hỏi',questionPlaceholder:'Gợi ý nhập câu hỏi',askName:'Nhãn người hỏi',askNamePlaceholder:'Gợi ý tên người hỏi',askPrivacy:'Hướng dẫn ẩn danh',askSubmit:'Nút gửi câu hỏi',askRequired:'Nhắc nhập câu hỏi',askSuccessTitle:'Tiêu đề đã nhận câu hỏi',askSuccessBody:'Nội dung đã nhận câu hỏi',askAnother:'Nút gửi câu hỏi khác',askReceipt:'Mã câu hỏi',askHint:'Giới hạn ký tự'};
function drawPanel(){
 $('#panel').innerHTML=`<p class="editor-note">Bản nháp được lưu trên trình duyệt này. Xuất JSON để giữ lại toàn bộ nội dung và logo. Chỉnh sửa chưa cập nhật lên bản online.</p><div id="editor-status" class="editor-status" role="status"></div><details open><summary>Thương hiệu và màu sắc</summary><label>Tên thương hiệu</label><input data-edit="brand" value="${esc(config.brand)}"><label>Logo</label><input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp"><p class="editor-note">PNG nền trong suốt là phù hợp nhất. Ảnh được thu gọn và lưu trong JSON.</p><button class="btn secondary" id="remove-logo">Xóa logo</button><div class="pair"><div><label>Xanh dương</label><input type="color" data-edit="primary" value="${esc(config.primary)}"></div><div><label>Xanh lá</label><input type="color" data-edit="accent" value="${esc(config.accent)}"></div></div><label>Ngôn ngữ khi mở form</label><select data-edit="defaultLanguage"><option value="en" ${config.defaultLanguage==='en'?'selected':''}>English</option><option value="vi" ${config.defaultLanguage==='vi'?'selected':''}>Tiếng Việt</option></select></details>
 <details><summary>Trang chính và gửi câu hỏi</summary>${Object.entries(config.tools).map(([k,v])=>editPair(v,'tools.'+k,toolLabels[k]||k)).join('')}</details>
 <details><summary>Khảo sát · Mở đầu và chân trang</summary>${['eyebrow','title','intro','duration','privacy','footer'].map(k=>editPair(config.text[k],'text.'+k,textLabels[k])).join('')}${config.text.steps.map((x,i)=>editPair(x,'text.steps.'+i,'Tên bước '+(i+1))).join('')}</details>
 ${config.questions.map((q,i)=>`<details><summary>Câu ${i+1} · ${esc(q.label.vi)}</summary>${editPair(q.label,'questions.'+i+'.label','Câu hỏi')}${(q.options||[]).map((o,j)=>editPair(o.label,`questions.${i}.options.${j}.label`,'Lựa chọn '+(j+1))).join('')}</details>`).join('')}
 <details><summary>Thông tin liên hệ</summary>${['contactTitle','contactHint','name','company','email','noEmail'].map(k=>editPair(config.text[k],'text.'+k,textLabels[k])).join('')}</details>
 <details><summary>Lời cảm ơn</summary>${['successTitle','successBody','receipt'].map(k=>editPair(config.text[k],'text.'+k,textLabels[k])).join('')}</details>
 <details><summary>Nút và thông báo</summary>${Object.keys(textLabels).filter(k=>!['eyebrow','title','intro','duration','privacy','footer','contactTitle','contactHint','name','company','email','noEmail','successTitle','successBody','receipt'].includes(k)).map(k=>editPair(config.text[k],'text.'+k,textLabels[k])).join('')}</details>
 <details><summary>QR cho bản online</summary><label>Địa chỉ GitHub Pages sau khi xuất bản</label><input id="public-url" type="url" placeholder="https://…" value="${esc(config.surveyUrl||'')}"><div class="download-row"><button class="btn" id="make-qr">Tạo QR</button></div><div id="qr"></div><div id="qr-actions"></div><p class="editor-note">Chỉ tạo QR khi đã có đường dẫn bản online hoạt động.</p></details>
 <details><summary>Kết nối Google Sheet</summary><label>URL Apps Script</label><input data-edit="backendUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(config.backendUrl||'')}"><p class="editor-note">Có thể để trống khi chỉnh sửa. Bản final sẽ dùng URL này để gửi phản hồi.</p></details>
 <details><summary>Khôi phục</summary><button class="btn secondary" id="reset">Khôi phục nội dung ban đầu</button></details>`;
 $('#panel').querySelectorAll('[data-edit]').forEach(el=>el.oninput=()=>{setPath(config,el.dataset.edit,el.value);if(el.dataset.edit==='defaultLanguage')lang=el.value;saveDraft();render()});
 $('#remove-logo').onclick=()=>{config.logo='';saveDraft();render()};
 $('#logo-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10000000)throw Error('Chọn ảnh PNG, JPG hoặc WebP dưới 10 MB.');const url=URL.createObjectURL(f);const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});const scale=Math.min(1,600/im.width,240/im.height);const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);config.logo=cv.toDataURL('image/png');URL.revokeObjectURL(url);if(config.logo.length>300000)config.logo=cv.toDataURL('image/webp',.85);saveDraft();render();editorStatus('Đã cập nhật logo.')}catch(err){editorStatus(err.message||'Không đọc được ảnh.')}};
 $('#reset').onclick=()=>{if(confirm('Khôi phục nội dung ban đầu? Hãy xuất JSON nếu cần giữ bản đang sửa.')){config=structuredClone(BOOT.config);lang=config.defaultLanguage;saveDraft();drawPanel();render()}};
 $('#make-qr').onclick=()=>{try{const url=new URL($('#public-url').value.trim());if(url.protocol!=='https:')throw Error('Vui lòng dùng địa chỉ HTTPS.');config.surveyUrl=url.href;saveDraft();const qr=qrcode(0,'M');qr.addData(url.href);qr.make();const svg=qr.createSvgTag({cellSize:5,margin:20,scalable:true});$('#qr').innerHTML=svg;$('#qr-actions').innerHTML='<button class="btn secondary" id="save-qr">Tải QR SVG ↓</button>';$('#save-qr').onclick=()=>download('THT_Feedback_QR.svg',svg,'image/svg+xml')}catch(err){editorStatus('Kiểm tra lại đường dẫn bản online.')}};
}
if(isEditor){try{const saved=migrateConfig(JSON.parse(localStorage.getItem('tht-visit-config-v1')));if(saved){validateConfig(saved);config=saved;lang=config.defaultLanguage}}catch{}editor()}else render();
</script></body></html>
